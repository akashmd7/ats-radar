<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Job Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7EBEE; --card:#FDFDFC; --ink:#111A22; --ink-soft:#4A5A69;
    --line:#C9D2D9; --signal:#1F4FD8; --warm:#A8480B; --quiet:#7A8894;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:15px;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px; margin:0 auto; padding:32px 20px 72px}
  header{border-bottom:2px solid var(--ink); padding-bottom:18px}
  h1{
    font-family:Archivo,sans-serif; font-weight:700;
    font-size:clamp(30px,6vw,46px); letter-spacing:-.025em; margin:0; line-height:1;
  }
  .sub{color:var(--ink-soft); margin:8px 0 0; max-width:46ch}

  .meters{display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:24px}
  .meter{padding:14px 22px 14px 0; margin-right:22px; border-right:1px solid var(--line)}
  .meter:last-child{border-right:none; margin-right:0}
  .meter b{
    display:block; font-family:"IBM Plex Mono",monospace; font-size:26px;
    font-weight:500; letter-spacing:-.02em;
  }
  .meter span{
    font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--quiet);
  }

  .controls{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px}
  input,select{
    font-family:inherit; font-size:14px; padding:9px 12px; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:2px;
  }
  input{flex:1 1 220px}
  input:focus,select:focus{outline:2px solid var(--signal); outline-offset:1px; border-color:var(--signal)}

  .band{
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--quiet); margin:28px 0 10px;
    display:flex; align-items:center; gap:12px;
  }
  .band::after{content:""; flex:1; height:1px; background:var(--line)}

  .job{
    display:block; text-decoration:none; color:inherit; background:var(--card);
    border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:2px; padding:14px 16px; margin-bottom:7px;
    transition:border-left-color .12s ease, transform .12s ease;
  }
  .job:hover,.job:focus-visible{border-left-color:var(--signal); transform:translateX(2px)}
  .job:focus-visible{outline:2px solid var(--signal); outline-offset:2px}
  .job.fresh{border-left-color:var(--warm)}

  .row{display:flex; gap:14px; align-items:baseline}
  .t{font-weight:500; flex:1; letter-spacing:-.005em}
  .age{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--quiet); white-space:nowrap}
  .job.fresh .age{color:var(--warm)}
  .m{
    font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft);
    margin-top:5px; display:flex; gap:8px; flex-wrap:wrap;
  }
  .m .co{color:var(--ink); font-weight:500}
  .m .sep{color:var(--line)}

  .decay{height:2px; background:var(--line); margin-top:10px; position:relative}
  .decay i{position:absolute; top:0; bottom:0; left:0; background:var(--signal); display:block}
  .job.fresh .decay i{background:var(--warm)}

  .empty{padding:44px 0; color:var(--ink-soft); font-family:"IBM Plex Mono",monospace; font-size:13px}
  footer{
    margin-top:52px; padding-top:16px; border-top:1px solid var(--line);
    font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--quiet);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
  @media (max-width:560px){
    .meter{padding-right:14px; margin-right:14px}
    .row{flex-direction:column; gap:4px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job Radar</h1>
    <p class="sub">Data engineering roles across Bengaluru, Chennai and Hyderabad</p>
  </header>

  <div class="meters">
    <div class="meter"><b id="mTotal">0</b><span>open roles</span></div>
    <div class="meter"><b id="mFresh">0</b><span>this week</span></div>
    <div class="meter"><b>2</b><span>companies watched</span></div>
    <div class="meter"><b>30</b><span>day window</span></div>
  </div>

  <div class="controls">
    <input id="q" type="search" placeholder="Filter by title or location" aria-label="Filter roles">
    <select id="co" aria-label="Filter by company"><option value="">All companies</option></select>
    <select id="sort" aria-label="Sort roles">
      <option value="age">Newest posted</option>
      <option value="found">Recently found</option>
      <option value="company">Company</option>
    </select>
  </div>

  <div id="list"></div>

  <footer>
    <span>Last checked 15 Aug 2026, 20:01 UTC</span>
    <span>Polled directly from company ATS</span>
  </footer>
</div>

<script>
const JOBS = [{"company": "Caterpillar", "title": "Software Engineer - Data Engineering", "location": "Chennai, Tamil Nadu, Bangalore, Karnataka", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Chennai-Tamil-Nadu/Software-Engineer---Data-Engineering_R0000379451", "age": 8, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Lead Software Engineer- Data Engineer", "location": "Chennai, Tamil Nadu, Bangalore, Karnataka", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Chennai-Tamil-Nadu/Lead-Software-Engineer--Data-Engineer_R0000386233", "age": 8, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Senior Software Engineer - Data Engineering", "location": "Chennai, Tamil Nadu, Bangalore, Karnataka", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Chennai-Tamil-Nadu/Senior-Software-Engineer---Data-Engineering_R0000386238", "age": 8, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Software Engineer - QA", "location": "Chennai, Tamil Nadu", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Chennai-Tamil-Nadu/Software-Engineer_R0000383222", "age": 5, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Lead Software Engineer  (Onestream )", "location": "Bangalore, Karnataka", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Bangalore-Karnataka/Senior-Software-Engineer--Onestream-Technical-Analyst-_R0000371358", "age": 12, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Senior Software Engineer", "location": "Bangalore, Karnataka", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Bangalore-Karnataka/Senior-Software-Engineer_R0000386957", "age": 2, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Senior Software Engineer - Digital Twin &amp; React Web Development", "location": "Bangalore, Karnataka", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Bangalore-Karnataka/Senior-Software-Engineer---Digital-Twin---React-Web-Development_R0000381972", "age": 5, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Manager Software Engineering -UI", "location": "Bangalore, Karnataka, Chennai, Tamil Nadu", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Bangalore-Karnataka/Manager-Software-Engineering--UI_R0000371823", "age": 4, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Lead Software Engineer (AWS, Snowflake &amp; ML Backend)", "location": "Chennai, Tamil Nadu, Bangalore, Karnataka", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Chennai-Tamil-Nadu/Lead-Software-Engineer--AWS--Snowflake---ML-Backend-_R0000386976-1", "age": 8, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Manager Software Engineering - D365 CE", "location": "Bangalore, Karnataka, Chennai, Tamil Nadu", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Bangalore-Karnataka/Manager-Software-Engineer---D365-CE_R0000366600", "age": 21, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Senior Manager Software Engineering - Microsoft Dynamics 365", "location": "Bangalore, Karnataka", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Bangalore-Karnataka/Senior-Manager-Software-Engineering---Microsoft-Dynamics-365_R0000386772-1", "age": 9, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Senior Software Engineer- UI Developer", "location": "Bangalore, Karnataka, Chennai, Tamil Nadu", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Bangalore-Karnataka/Software-Engineer--UI-Developer_R0000354460", "age": 10, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Caterpillar", "title": "Lead Software Engineer - Adobe Workfront", "location": "Bangalore, Karnataka, Chennai, Tamil Nadu", "url": "https://cat.wd5.myworkdayjobs.com/en-US/CaterpillarCareers/job/Bangalore-Karnataka/Lead-Software-Engineer---Workfront_R0000377394", "age": 2, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Salesforce", "title": "Software Engineering LMTS - Release Engineering", "location": "India - Hyderabad", "url": "https://salesforce.wd12.myworkdayjobs.com/en-US/External_Career_Site/job/India---Hyderabad/Software-Engineering-LMTS---Release-Engineering_JR354137-1", "age": 0, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Salesforce", "title": "Senior Manager, Software Engineering", "location": "India - Bangalore", "url": "https://salesforce.wd12.myworkdayjobs.com/en-US/External_Career_Site/job/India---Bangalore/Senior-Manager--Software-Engineering_JR349577", "age": 1, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Salesforce", "title": "Software Engineering -SMTS", "location": "India - Hyderabad", "url": "https://salesforce.wd12.myworkdayjobs.com/en-US/External_Career_Site/job/India---Hyderabad/Performance-Engineer--MTS-SMTS-_JR312773", "age": 1, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Salesforce", "title": "Lead Software Engineer / LMTS - Backend - Bangalore", "location": "India - Bangalore", "url": "https://salesforce.wd12.myworkdayjobs.com/en-US/External_Career_Site/job/India---Bangalore/Lead-Software-Engineer---LMTS---Backend---Bangalore_JR282411", "age": 2, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Salesforce", "title": "Manager, Software Engineering - Release Engineering", "location": "India - Hyderabad", "url": "https://salesforce.wd12.myworkdayjobs.com/en-US/External_Career_Site/job/India---Hyderabad/Manager--Software-Engineering---Release-Engineering_JR355612", "age": 3, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Salesforce", "title": "Software Engineering LMTS - Tableau", "location": "India - Hyderabad", "url": "https://salesforce.wd12.myworkdayjobs.com/en-US/External_Career_Site/job/India---Hyderabad/Software-Engineering-LMTS---Tableau_JR327543", "age": 10, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Salesforce", "title": "Senior Software Engineering Manager \u2014 CI/Build Systems &amp; Developer Productivity Platform", "location": "India - Bangalore", "url": "https://salesforce.wd12.myworkdayjobs.com/en-US/External_Career_Site/job/India---Bangalore/Senior-Software-Engineering-Manager---CI-Build-Systems---Developer-Productivity-Platform_JR347014", "age": 12, "first_seen": "2026-08-15T20:01:15.070599+00:00"}, {"company": "Salesforce", "title": "Software Engineering PMTS", "location": "India - Bangalore, India - Hyderabad", "url": "https://salesforce.wd12.myworkdayjobs.com/en-US/External_Career_Site/job/India---Bangalore/Software-Engineering-PMTS_JR323939-1", "age": 30, "first_seen": "2026-08-15T20:01:15.070599+00:00"}];
const WINDOW = 30;
const list = document.getElementById('list');
const q = document.getElementById('q');
const co = document.getElementById('co');
const sort = document.getElementById('sort');

[...new Set(JOBS.map(j => j.company))].sort().forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c; co.appendChild(o);
});

function ageLabel(d){
  if (d === null || d === undefined) return 'date unknown';
  if (d === 0) return 'today';
  if (d === 1) return 'yesterday';
  return d + 'd ago';
}
function band(d){
  if (d === null || d === undefined) return 'Undated';
  if (d <= 1) return 'Today';
  if (d <= 7) return 'This week';
  if (d <= 21) return 'Earlier this month';
  return 'Older';
}

function render(){
  const term = q.value.trim().toLowerCase();
  const company = co.value;
  let rows = JOBS.filter(j =>
    (!company || j.company === company) &&
    (!term || (j.title + ' ' + j.location).toLowerCase().includes(term))
  );

  if (sort.value === 'company')
    rows.sort((a,b) => a.company.localeCompare(b.company) || (a.age ?? 999) - (b.age ?? 999));
  else if (sort.value === 'found')
    rows.sort((a,b) => b.first_seen.localeCompare(a.first_seen));
  else
    rows.sort((a,b) => (a.age ?? 999) - (b.age ?? 999));

  document.getElementById('mTotal').textContent = rows.length;
  document.getElementById('mFresh').textContent =
    rows.filter(j => j.age !== null && j.age <= 7).length;

  if (!rows.length){
    list.innerHTML = '<p class="empty">No roles match this filter. Clear the search to see everything currently open.</p>';
    return;
  }

  let out = '', lastBand = null;
  const grouped = sort.value === 'age';
  for (const j of rows){
    if (grouped){
      const b = band(j.age);
      if (b !== lastBand){ out += '<div class="band">' + b + '</div>'; lastBand = b; }
    }
    const fresh = j.age !== null && j.age <= 7;
    const left = j.age === null ? 0 : Math.max(0, Math.min(100, 100 - (j.age / WINDOW) * 100));
    out += '<a class="job' + (fresh ? ' fresh' : '') + '" href="' + j.url + '" target="_blank" rel="noopener">'
      + '<div class="row"><span class="t">' + j.title + '</span>'
      + '<span class="age">' + ageLabel(j.age) + '</span></div>'
      + '<div class="m"><span class="co">' + j.company + '</span>'
      + '<span class="sep">/</span><span>' + j.location + '</span></div>'
      + '<div class="decay"><i style="width:' + left.toFixed(0) + '%"></i></div></a>';
  }
  list.innerHTML = out;
}

[q, co, sort].forEach(el => el.addEventListener('input', render));
render();
</script>
</body>
</html>
